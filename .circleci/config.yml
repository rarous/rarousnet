# yaml-language-server: $schema=https://json.schemastore.org/circleciconfig.json
# Use the latest 2.1 version of CircleCI pipeline process engine.
# See: https://circleci.com/docs/configuration-reference
version: 2.1
orbs:
  browser-tools: circleci/browser-tools@1.4.9
  node: circleci/node@6.0.0
  php: circleci/php@1.1.0
  pulumi: pulumi/pulumi@2.1.0
  slack: circleci/slack@5.1.1

executors:
  pw-focal-development:
    docker:
      - image: mcr.microsoft.com/playwright:v1.48.2-focal

commands:
  install_browsers:
    steps:
      - restore_cache:
          name: Restore Playwright browsers
          keys:
            - v2-browsers-{{ checksum "cards/package.json" }}
      - run:
          name: Install Playwright browsers
          command: yarn playwright install --with-deps chromium
          working_directory: cards
      - save_cache:
          name: Cache Playwright browsers
          key: v2-browsers-{{ checksum "cards/package.json" }}
          paths:
            - ~/.cache/ms-playwright

jobs:
  provision:
    docker:
      - image: cimg/node:current
    resource_class: arm.large
    steps:
      - checkout
      - pulumi/login
      - node/install-yarn
      - node/install-packages:
          pkg-manager: yarn-berry
          with-cache: false
          override-ci-command: yarn workspaces focus @rarousnet/infrastructure
      - pulumi/update:
          working_directory: infrastructure
          stack: prod
          skip-preview: true
      - slack/notify:
          event: fail
          template: basic_fail_1
  generate:
    resource_class: large
    docker:
      - image: cimg/clojure:1.11-node
        environment:
          LEIN_JVM_OPTS: "-Xmx400m"
          JVM_OPTS: "-Xmx3200m"
    steps:
      - checkout
      - attach_workspace:
          at: .
      - node/install
      - node/install-yarn
      - php/install-php:
          version: "$(jq --raw-data '.platform.php' generator/composer.lock)"
      - php/install-composer
      - node/install-packages:
          pkg-manager: yarn-berry
          with-cache: false
          override-ci-command: yarn workspaces focus rarousnet @rarousnet/website
      - php/install-packages:
          app-dir: ~/project/generator
          install-flags: --ignore-platform-reqs --no-interaction --prefer-dist
      - restore_cache:
          name: Restore deps cache
          keys:
            - v4-dependencies-{{ checksum "generator/deps.edn" }}
      - run:
          name: Build website
          command: yarn build
      - save_cache:
          name: Store deps cache
          key: v4-dependencies-{{ checksum "generator/deps.edn" }}
          paths:
            - ~/.m2
            - generator/.cpcache
      - persist_to_workspace:
          root: .
          paths:
            - .gryphoon
      - slack/notify:
          event: fail
          template: basic_fail_1
  test:
    resource_class: large
    docker:
      - image: cimg/node:23.3.0-browsers
    steps:
      - checkout
      - attach_workspace:
          at: .
      - run: |
          sudo apt-get update
          sudo apt-get install libnss3-tools
      - browser-tools/install-chrome
      - node/install
      - node/install-yarn
      - node/install-packages:
          pkg-manager: yarn-berry
          with-cache: false
          override-ci-command: yarn workspaces focus rarousnet
      - run:
          name: Install self-signed cert for localhost
          command: |
            mkdir -p $HOME/.pki/nssdb
            echo "Cert path: ./node_modules/lws/ssl/lws-cert.pem"
            certutil -N -d $HOME/.pki/nssdb --empty-password
            certutil -A -d sql:$HOME/.pki/nssdb -t TC -n lws-cert -i ./node_modules/lws/ssl/lws-cert.pem
            certutil -L -d sql:$HOME/.pki/nssdb
      - run:
          name: Serve site content
          command: yarn serve
          background: true
      - run:
          name: Test site with Lighthouse
          command: |
            yarn test:lighthouse
            yarn test:ava
      - store_artifacts:
          path: ./results
      - store_test_results:
          path: ./results
      - slack/notify:
          event: fail
          template: basic_fail_1
  pages_deploy:
    docker:
      - image: cimg/node:23.3.0
    resource_class: arm.large
    steps:
      - checkout
      - attach_workspace:
          at: .
      - node/install
      - node/install-yarn
      - node/install-packages:
          pkg-manager: yarn-berry
          with-cache: false
          override-ci-command: yarn workspaces focus rarousnet @rarousnet/website @rarousnet/functions
      - run:
          name: Publish to Cloudflare Pages
          working_directory: www.rarous.net
          command: npx wrangler pages deploy ../.gryphoon/dist --project-name=rarousnet
      - slack/notify:
          event: fail
          template: basic_fail_1
      - slack/notify:
          event: pass
          template: success_tagged_deploy_1
workflows:
  build_and_deploy:
    jobs:
      - generate
      - provision:
          context: aws
          filters:
            branches:
              only: trunk
      - test:
          requires:
            - generate
      - pages_deploy:
          context: cloudflare
          requires:
            - provision
            - test
          filters:
            branches:
              only: trunk
